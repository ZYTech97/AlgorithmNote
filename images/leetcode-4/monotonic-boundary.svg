<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-label="Monotonic predicate A(i): true for i=0 through 3, false for i=4 and 5"><rect width="820" height="190" rx="16" fill="white"/><rect x="38" y="37" width="113" height="84" rx="10" fill="#d8f3e6" stroke="#419e73" stroke-width="2"/><text x="94" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17233a">i = 0</text><text x="94" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13754e">TRUE</text><rect x="164" y="37" width="113" height="84" rx="10" fill="#d8f3e6" stroke="#419e73" stroke-width="2"/><text x="220" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17233a">i = 1</text><text x="220" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13754e">TRUE</text><rect x="290" y="37" width="113" height="84" rx="10" fill="#d8f3e6" stroke="#419e73" stroke-width="2"/><text x="346" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17233a">i = 2</text><text x="346" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13754e">TRUE</text><rect x="416" y="37" width="113" height="84" rx="10" fill="#d8f3e6" stroke="#419e73" stroke-width="4"/><text x="472" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17233a">i = 3</text><text x="472" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13754e">TRUE</text><rect x="542" y="37" width="113" height="84" rx="10" fill="#fee2e2" stroke="#dc7373" stroke-width="2"/><text x="598" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17233a">i = 4</text><text x="598" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ac3636">FALSE</text><rect x="668" y="37" width="113" heigh