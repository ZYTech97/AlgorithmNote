<svg xmlns="http://www.w3.org/2000/svg" width="740" height="240" viewBox="0 0 740 240"><style>.bar{fill:#94a3b8;stroke:#64748b}.water{fill:#93c5fd;stroke:#3b82f6;stroke-opacity:.5}.heading{font:600 17px Arial,sans-serif;fill:#172033}.small{font:14px Arial,sans-serif;fill:#334155}.caption{font:14px Arial,sans-serif;fill:#334155}</style><text x="20" y="25" class="heading">位置 i = 2 的接水量由两侧最高柱子的较小值决定</text><g transform="translate(150 15)"><text x="20" y="22" class="heading"></text><rect x="34" y="102" width="48" height="54" class="bar"/><text x="58" y="174" text-anchor="middle" class="small">0</text><rect x="99" y="102" width="48" height="54" class="water"/><text x="123" y="174" text-anchor="middle" class="small">1</text><rect x="164" y="102" width="48" height="27" class="water"/><rect x="164" y="129" width="48" height="27" class="bar"/><text x="188" y="174" text-anchor="middle" class="small">2</text><rect x="229" y="102" width="48" height="54" class="water"/><text x="253" y="174" text-anchor="middle" class="small">3</text><rect x="294" y="75" width="48" height="81" class="bar"/><text x="318" y="174" text-anchor="middle" class="small">4</text><text x="20" y="197" class="small">左侧最高 = 2；右侧最高 = 3；水位 = min(2, 3) = 2</text></g><text x="20" y="225" class="caption">蓝色为积水，灰色为柱子。位置 2 高度为 1，接水量 = 2 - 1 = 1。</text></svg>