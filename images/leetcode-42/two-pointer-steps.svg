<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1010" viewBox="0 0 780 1010"><style>.bar{fill:#94a3b8;stroke:#64748b}.water{fill:#93c5fd;stroke:#3b82f6;stroke-opacity:.5}.heading{font:600 17px Arial,sans-serif;fill:#172033}.small{font:14px Arial,sans-serif;fill:#334155}.caption{font:14px Arial,sans-serif;fill:#334155}</style><style>.left{font:bold 15px Arial;fill:#dc2626}.right{font:bold 15px Arial;fill:#15803d}</style><text x="16" y="25" class="heading">双指针逐步推进：height = [2, 0, 1, 0, 3]</text><g><text x="16" y="72" class="heading">步骤 0</text><text x="16" y="96" class="small">left_max=2, right_max=3</text><text x="16" y="120" class="small">累计雨水=0</text><text x="16" y="158" class="small">初始：两端柱子接水量均为 0</text><rect x="300" y="95" width="49" height="48" class="bar"/><text x="324" y="160" text-anchor="middle" class="small">0</text><text x="324" y="176" text-anchor="middle" class="left">L</text><text x="394" y="160" text-anchor="middle" class="small">1</text><rect x="440" y="119" width="49" height="24" class="bar"/><text x="464" y="160" text-anchor="middle" class="small">2</text><text x="534" y="160" text-anchor="middle" class="small">3</text><rect x="580" y="71" width="49" height="72" class="bar"/><text x="604" y="160" text-anchor="middle" class="small">4</text><text x="604" y="191" text-anchor="middle" class="right">R</text></g><g><text x="16" y="229" class="heading">步骤 1</text><text x="16" y="253" class="small">left_max=2, right_max=3</text><text x="16" y="277" class="small">累计雨水=0</text><text x="16" y="315" class="small">处理左端位置 0，移动 left → 1</text><rect x="300" y="252" width="49" height="48" class="bar"/><text x="324" y="317" text-anchor="middle" class="small">0</text><text x="394" y="317" text-anchor="middle" class="small">1</text><text x="394" y="333" text-anchor="middle" class="left">L</text><rect x="440" y="276" width="49" height="24" class="bar"/><text x="464" y="317" text-anchor="middle" class="small">2</text><text x="534" y="317" text-anchor="middle" class="small">3</text><rect x="580" y="228" width="49" height="72" class="bar"/><text x="604" y="317" text-anchor="middle" class="small">4</text><text x="604" y="348" text-anchor="middle" class="right">R</text></g><g><text x="16" y="386" class="heading">步骤 2</text><text x="16" y="410" class="small">left_max=2, right_max=3</text><text x="16" y="434" class="small">累计雨水=2</text><text x="16" y="472" class="small">处理位置 1：接水量 2 - 0 = 2</text><rect x="300" y="409" width="49" height="48" class="bar"/><text x="324" y="474" text-anchor="middle" class="small">0</text><rect x="370" y="409" width="49" height="48" class="water"/><text x="394" y="474" text-anchor="middle" class="small">1</text><rect x="440" y="433" width="49" height="24" class="bar"/><text x="464" y="474" text-anchor="middle" class="small">2</text><text x="464" y="490" text-anchor="middle" class="left">L</text><text x="534" y="474" text-anchor="middle" class="small">3</text><rect x="580" y="385" width="49" height="72" class="bar"/><text x="604" y="474" text-anchor="middle" class="small">4</text><text x="604" y="505" text-anchor="middle" class="right">R</text></g><g><text x="16" y="543" class="heading">步骤 3</text><text x="16" y="567" class="small">left_max=2, right_max=3</text><text x="16" y="591" class="small">累计雨水=3</text><text x="16" y="629" class="small">处理位置 2：接水量 2 - 1 = 1</text><rect x="300" y="566" width="49" height="48" class="bar"/><text x="324" y="631" text-anchor="middle" class="small">0</text><rect x="370" y="566" width="49" height="48" class="water"/><text x="394" y="631" text-anchor="middle" class="small">1</text><rect x="440" y="566" width="49" height="24" class="water"/><rect x="440" y="590" width="49" height="24" class="bar"/><text x="464" y="631" text-anchor="middle" class="small">2</text><text x="534" y="631" text-anchor="middle" class="small">3</text><text x="534" y="647" text-anchor="middle" class="left">L</text><rect x="580" y="542" width="49" height="72" class="bar"/><text x="604" y="631" text-anchor="middle" class="small">4</text><text x="604" y="662" text-anchor="middle" class="right">R</text></g><g><text x="16" y="700" class="heading">步骤 4</text><text x="16" y="724" class="small">left_max=2, right_max=3</text><text x="16" y="748" class="small">累计雨水=5</text><text x="16" y="786" class="small">处理位置 3：接水量 2 - 0 = 2</text><rect x="300" y="723" width="49" height="48" class="bar"/><text x="324" y="788" text-anchor="middle" class="small">0</text><rect x="370" y="723" width="49" height="48" class="water"/><text x="394" y="788" text-anchor="middle" class="small">1</text><rect x="440" y="723" width="49" height="24" class="water"/><rect x="440" y="747" width="49" height="24" class="bar"/><text x="464" y="788" text-anchor="middle" class="small">2</text><rect x="510" y="723" width="49" height="48" class="water"/><text x="534" y="788" text-anchor="middle" class="small">3</text><rect x="580" y="699" width="49" height="72" class="bar"/><text x="604" y="788" text-anchor="middle" class="small">4</text><text x="604" y="804" text-anchor="middle" class="left">L</text><text x="604" y="819" text-anchor="middle" class="right">R</text></g><g><text x="16" y="857" class="heading">步骤 5</text><text x="16" y="881" class="small">left_max=3, right_max=3</text><text x="16" y="905" class="small">累计雨水=5</text><text x="16" y="943" class="small">处理位置 4：接水量 0，算法结束</text><rect x="300" y="880" width="49" height="48" class="bar"/><text x="324" y="945" text-anchor="middle" class="small">0</text><rect x="370" y="880" width="49" height="48" class="water"/><text x="394" y="945" text-anchor="middle" class="small">1</text><rect x="440" y="880" width="49" height="24" class="water"/><rect x="440" y="904" width="49" height="24" class="bar"/><text x="464" y="945" text-anchor="middle" class="small">2</text><rect x="510" y="880" width="49" height="48" class="water"/><text x="534" y="945" text-anchor="middle" class="small">3</text><rect x="580" y="856" width="49" height="72" class="bar"/><text x="604" y="945" text-anchor="middle" class="small">4</text><text x="604" y="976" text-anchor="middle" class="right">R</text></g><text x="16" y="1000" class="caption">L = left，R = right；蓝色为已确定的雨水，最终接水量为 5。</text></svg>