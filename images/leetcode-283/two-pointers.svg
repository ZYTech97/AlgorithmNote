<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278">
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:17px;font-weight:bold}.small{font-size:14px}.cell{fill:#f1f5f9;stroke:#94a3b8}.done{fill:#dcfce7;stroke:#16a34a}.zero{fill:#fee2e2;stroke:#ef4444}</style>
<text x="24" y="27" class="title">双指针：将非零元素写入数组前部</text>
<text x="24" y="61" class="small">初始：i = 0，j = 0</text>
<g transform="translate(230 43)"><rect class="cell" x="0" y="0" width="68" height="42"/><rect class="cell" x="68" y="0" width="68" height="42"/><rect class="cell" x="136" y="0" width="68" height="42"/><rect class="cell" x="204" y="0" width="68" height="42"/><rect class="cell" x="272" y="0" width="68" height="42"/><g font-size="19" text-anchor="middle"><text x="34" y="28">0</text><text x="102" y="28">1</text><text x="170" y="28">0</text><text x="238" y="28">3</text><text x="306" y="28">12</text></g></g>
<text x="24" y="122" class="small">扫描结束：j = 3，前 3 位已是非零序列</text>
<g transform="translate(230 104)"><rect class="done" x="0" y="0" width="68" height="42"/><rect class="done" x="68" y="0" width="68" height="42"/><rect class="done" x="136" y="0" width="68" height="42"/><rect class="cell" x="204" y="0" width="68" height="42"/><rect class="cell" x="272" y="0" width="68" height="42"/><g font-size="19" text-anchor="middle"><text x="34" y="28">1</text><text x="102" y="28">3</text><text x="170" y="28">12</text><text x="238" y="28">3</text><text x="306" y="28">12</text></g><text x="204" y="62" font-size="14" fill="#dc2626">↑ j</text></g>
<text x="24" y="214" class="small">填充剩余位置为 0</text>
<g transform="translate(230 194)"><rect class="done" x="0" y="0" width="68" height="42"/><rect class="done" x="68" y="0" width="68" height="42"/><rect class="done" x="136" y="0" width="68" height="42"/><rect class="zero" x="204" y="0" width="68" height="42"/><rect class="zero" x="272" y="0" width="68" height="42"/><g font-size="19" text-anchor="middle"><text x="34" y="28">1</text><text x="102" y="28">3</text><text x="170" y="28">12</text><text x="238" y="28">0</text><text x="306" y="28">0</text></g></g>
<text x="24" y="268" class="small">绿色：已按原顺序写入的非零元素；红色：最终填零区域。</text>
</svg>